services:
  - type: web
    name: ieum-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ms-2nd-project-integration-ver-1/Backend/Dockerfile
    dockerContext: ./ms-2nd-project-integration-ver-1/Backend
    dockerCommand: python -m ieum.start
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_MODE
        value: demo
      - key: LLM_PROVIDER
        value: nvidia
      - key: EMBEDDING_PROVIDER
        value: nvidia
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b
      - key: VECTOR_SEARCH_PROVIDER
        value: pgvector
      - key: PRODUCTIVITY_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
