name: Embedding reindex

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read index status or reindex all stored chunks
        required: true
        type: choice
        options:
          - status
          - reindex
      confirmation:
        description: Enter REINDEX to enable the reindex operation
        required: false
        type: string

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ms-2nd-project-integration-ver-1/Backend
    env:
      APP_MODE: demo
      LLM_PROVIDER: nvidia
      EMBEDDING_PROVIDER: nvidia
      NVIDIA_EMBEDDING_MODEL: nvidia/nemotron-3-embed-1b
      VECTOR_SEARCH_PROVIDER: pgvector
      PRODUCTIVITY_PROVIDER: mock
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ms-2nd-project-integration-ver-1/Backend/requirements.txt
      - name: Check inputs and secrets
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ -z "$DATABASE_URL" || -z "$NVIDIA_API_KEY" ]]; then
            echo "SUPABASE_DATABASE_URL and NVIDIA_API_KEY repository secrets are required" >&2
            exit 1
          fi
          if [[ "$OPERATION" == "reindex" && "$CONFIRMATION" != "REINDEX" ]]; then
            echo "Reindex requires confirmation=REINDEX" >&2
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Status before
        run: python -m ieum.demo index-status
      - name: Reindex all chunks
        if: inputs.operation == 'reindex'
        run: python -m ieum.demo reindex --confirm
      - name: Status after
        if: inputs.operation == 'reindex'
        run: python -m ieum.demo index-status
